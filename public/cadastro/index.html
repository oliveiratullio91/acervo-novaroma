<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17372c">
  <title>Criar conta | Acervo</title>
  <link rel="icon" href="/marca-acervo.png" type="image/png">
  <link rel="stylesheet" href="/estilo.css">
  <script type="module" src="/acesso.js"></script>
</head>
<body>
  <header class="cabecalho">
    <div class="conteudo topo">
      <a class="marca" href="/" aria-label="Acervo, início">
        <img class="marca-selo" src="/marca-acervo.png" alt="" width="49" height="49">
        <span><strong>Acervo</strong><small>Biblioteca acadêmica</small></span>
      </a>
      <a class="voltar-catalogo" href="/catalogo/"><span aria-hidden="true">←</span> Voltar ao catálogo</a>
    </div>
  </header>
  <main class="conteudo acesso">
    <div class="acesso-painel">
      <section class="acesso-formulario" aria-labelledby="titulo">
        <h1 id="titulo">Criar conta</h1>
        <p class="acesso-descricao">Cadastre-se como leitor para reservar livros e acompanhar seus empréstimos.</p>
        <form id="formulario-acesso" class="formulario-login" data-modo="cadastro" method="post" action="/api/cadastro">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" autocomplete="name" minlength="2" maxlength="120" required>
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="8" aria-describedby="requisito-senha" required>
          <p class="requisito-senha" id="requisito-senha">Use pelo menos 8 caracteres.</p>
          <label for="confirmar-senha">Confirme a senha</label>
          <input id="confirmar-senha" type="password" autocomplete="new-password" required>
          <p class="aviso aviso-erro" id="erro-acesso" role="alert" hidden></p>
          <button type="submit" class="botao" id="enviar">Criar conta</button>
        </form>
        <p class="acesso-troca">Já tem uma conta? <a id="outra-pagina" href="/entrar/">Entrar</a></p>
      </section>
      <div class="acesso-imagem">
        <img src="/biblioteca.webp" alt="" width="1536" height="1024">
      </div>
    </div>
  </main>
</body>
</html>
